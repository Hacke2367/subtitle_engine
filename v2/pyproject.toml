[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-subs"
version = "0.1.0"
description = "Hinglish / English video or voice -> Roman-script .srt and word-lit overlay subtitles"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voice_subs = ["fonts/*.ttf", "fonts/*.txt"]
